[project]
name = "pipen-gcs"
version = "1.1.2"
description = "A plugin for pipen to handle file metadata in Google Cloud Storage"
authors = [{name = "pwwang", email = "1188067+pwwang@users.noreply.github.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pipen>=1.1",
    "panpath[async-gs]>=0.4.8",
]

[project.optional-dependencies]
examples = [
    "pipen-verbose>=1.1.4",
    "python-dotenv>=1",
]
extra = ["ipykernel>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-vv -n 1 --cov-config=.coveragerc --cov=pipen_gcs --cov-report xml:.coverage.xml --cov-report term-missing"
console_output_style = "progress"
junit_family = "xunit1"
filterwarnings = []

[tool.uv]
prerelease = "allow"
